[workspace]
resolver = "3"
members = ["crates/sts2-core", "crates/sts2-macros", "crates/sts2-view", "crates/sts2-web", "crates/sts2-web-bot", "crates/sts2-diff", "crates/sts2-tui", "crates/sts2-bench", "crates/sts2-kernel", "crates/sts2-rl", "crates/sts2-ffi", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes_without_reason = "warn"
# Game logic must be exact: no floating point.
float_arithmetic = "deny"
# Internal, unpublished workspace: crates.io metadata and duplicate
# transitive versions are irrelevant here.
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

# Debug and test builds: line tables only (backtraces keep file:line) and no debug info for
# dependencies. Full debug info made each test binary ~250 MB and a checkout's target/debug ~9 GB;
# with several agent worktrees at once that filled the disk. Use `CARGO_PROFILE_DEV_DEBUG=true` for a
# debugger session.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Build of `sts2-diff` for tools/diff.sh, regress.sh and the other diff scripts (target/regress/): about
# 4x faster than the debug build at replaying combats, and an incremental rebuild after an engine edit
# takes about as long as a debug one. Debug assertions stay on because the engine checks itself with
# them (`REPLAY_CHECK` in sts2-core re-runs every step from its snapshot; without it `may_prompt` bugs
# go unnoticed), as do overflow checks; turning both off would double the speed but change what passes.
[profile.regress]
inherits = "release"
incremental = true
debug-assertions = true
overflow-checks = true

# Build of `sts2-bench` for `cargo xtask bench` (target/fast/): fat LTO and one codegen unit let
# the content modules inline across crates (PF3). Not the release profile, which `regress` inherits:
# it would make every engine rebuild several times slower. `panic = "abort"`: nothing built in this
# profile catches a panic (the sweep, which does, runs in `regress`); with PGO it measured 6% faster
# on fights (PF7).
[profile.fast]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"

# Build of the `sts2-ffi` library for the Python binding (`target/ffi/`, `python/sts2/`): the `fast`
# profile's fat LTO and one codegen unit, but unwinding, since every entry point of the C ABI
# catches panics.
[profile.ffi]
inherits = "release"
lto = "fat"
codegen-units = 1

# Build of the portable TUI binaries for `cargo xtask package`: one file to copy to another
# machine, so small and fast beats build time.
[profile.portable]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

# Build of the `sts2-web` wasm for the phone page (`crates/sts2-web/build.sh`): a phone downloads
# it, so small beats build time.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
