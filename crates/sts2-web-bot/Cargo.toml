[package]
name = "sts2-web-bot"
description = "The honest bot in the browser (WEB10): the web client's advice, its replay of a seed and where the player differed, in a wasm of its own the page loads in a Web Worker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sts2-core = { path = "../sts2-core" }
sts2-diff = { path = "../sts2-diff" }
sts2-view = { path = "../sts2-view" }
sts2-web = { path = "../sts2-web" }
serde_json = "1"
wasm-bindgen = "=0.2.129"
