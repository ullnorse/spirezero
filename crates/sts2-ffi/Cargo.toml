[package]
name = "sts2-ffi"
description = "The C ABI over sts2-rl's `Envs` batch, for the Python `PufferEnv` binding (docs/specs/rl-2x-plan.md, stage 8 and section 7.4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

# The workspace's lints, except that this crate is the one that allows `unsafe` (the workspace
# forbids it, and a member cannot override one workspace lint): every unsafe block carries a
# `// SAFETY:` comment and an unsafe fn's body is not one unsafe block.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes_without_reason = "warn"
float_arithmetic = "deny"
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[dependencies]
sts2-core = { path = "../sts2-core" }
sts2-rl = { path = "../sts2-rl" }

[build-dependencies]
sha2 = "0.10"
